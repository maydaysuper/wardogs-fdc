name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WardogsNavigator.csproj

      - name: Build
        run: dotnet build WardogsNavigator.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/WardogsNavigator.Tests/WardogsNavigator.Tests.csproj -c Release

      - name: Publish self-contained x64 onedir
        run: dotnet publish WardogsNavigator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - name: Smoke test published startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "publish\WardogsNavigator.exe"
          if (-not (Test-Path $exe)) { throw "Published EXE missing: $exe" }

          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru -Wait
          if ($smoke.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "WardogsNavigator\startup-error.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Startup smoke test failed with exit code $($smoke.ExitCode)"
          }

          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "WardogsNavigator\startup-error.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Published GUI exited during 5-second launch test. ExitCode=$($app.ExitCode)"
          }

          Stop-Process -Id $app.Id -Force
          "Published Windows GUI startup smoke test passed."

      - name: Package portable
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WardogsNavigator-win-x64.zip -Force

      - name: SHA-256 portable package
        shell: pwsh
        run: |
          $hash = (Get-FileHash WardogsNavigator-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  WardogsNavigator-win-x64.zip" | Tee-Object -FilePath WardogsNavigator-win-x64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WardogsNavigator-win-x64
          path: |
            publish/**
            WardogsNavigator-win-x64.zip
            WardogsNavigator-win-x64.sha256
          retention-days: 7
